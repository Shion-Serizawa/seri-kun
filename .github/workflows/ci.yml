name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "mise.toml"
      - "mise.lock"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/web/**"
      - "mise.toml"
      - "mise.lock"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Socket Firewall Free を版固定 + sha256 検証で取得する。
      # setup-vp は PATH 上の sfw を優先して使うため、内蔵ダウンロード（ハッシュ未検証）を通らない。
      # 版は setup-vp v1.22.0 が動作確認している v1.15.4 に揃える。
      - name: Install Socket Firewall (pinned)
        working-directory: ${{ runner.temp }}
        env:
          SFW_VERSION: v1.15.4
          SFW_SHA256: cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670
        run: |
          mkdir -p sfw-bin
          curl -fsSL --proto '=https' -o sfw-bin/sfw "https://github.com/SocketDev/sfw-free/releases/download/${SFW_VERSION}/sfw-free-linux-x86_64"
          echo "${SFW_SHA256}  sfw-bin/sfw" | sha256sum --check --strict
          chmod +x sfw-bin/sfw
          echo "${RUNNER_TEMP}/sfw-bin" >> "$GITHUB_PATH"

      # Vite+ 本体のバージョンは apps/web/package.json の vite-plus（完全固定）から解決される。
      # pnpm は packageManager フィールドのバージョンが使われる。
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: apps/web
          node-version: 24.22.1
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          # Socket Firewall で既知の悪性パッケージの取得をブロックする
          sfw: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']

      - name: Install Playwright system dependencies
        run: vp exec playwright install-deps chromium

      - name: Generate content metadata
        run: vp run gen:meta

      # vp check の型チェックは astro:content 等の型（.astro/types.d.ts）を参照するため先に生成する
      - name: Generate Astro types
        run: vp run sync

      - name: Format / Lint / Type-aware check
        run: vp check

      - name: Typecheck (Astro)
        run: vp run typecheck

      - name: Unit tests
        run: vp test run

      - name: E2E tests
        run: vp run test:e2e

      - name: Build
        run: vp run build

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      deployments: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Socket Firewall Free を版固定 + sha256 検証で取得する。
      # setup-vp は PATH 上の sfw を優先して使うため、内蔵ダウンロード（ハッシュ未検証）を通らない。
      # 版は setup-vp v1.22.0 が動作確認している v1.15.4 に揃える。
      - name: Install Socket Firewall (pinned)
        working-directory: ${{ runner.temp }}
        env:
          SFW_VERSION: v1.15.4
          SFW_SHA256: cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670
        run: |
          mkdir -p sfw-bin
          curl -fsSL --proto '=https' -o sfw-bin/sfw "https://github.com/SocketDev/sfw-free/releases/download/${SFW_VERSION}/sfw-free-linux-x86_64"
          echo "${SFW_SHA256}  sfw-bin/sfw" | sha256sum --check --strict
          chmod +x sfw-bin/sfw
          echo "${RUNNER_TEMP}/sfw-bin" >> "$GITHUB_PATH"

      # Vite+ 本体のバージョンは apps/web/package.json の vite-plus（完全固定）から解決される。
      # pnpm は packageManager フィールドのバージョンが使われる。
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: apps/web
          node-version: 24.22.1
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          # Socket Firewall で既知の悪性パッケージの取得をブロックする
          sfw: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']

      - name: Verify metadata reproducibility
        run: |
          vp run gen:meta
          git diff --exit-code

      - name: Build
        run: vp run build

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # devDependencies と同じ版にして、Action 側での追加インストールを避ける
          wranglerVersion: "4.152.0"
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main

      - name: Show deployment URL
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Deployment Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
