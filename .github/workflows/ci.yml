name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "mise.toml"
      - "mise.lock"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/web/**"
      - "mise.toml"
      - "mise.lock"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # sfw（版固定 + sha256 検証）と Vite+ のセットアップ、frozen install（両ジョブ共通）
      - name: Setup web toolchain
        uses: ./.github/actions/setup-web

      - name: Install Playwright system dependencies
        run: vp exec playwright install-deps chromium

      - name: Generate content metadata
        run: vp run gen:meta

      # package.json の check（astro sync → vp check）をそのまま使い、ローカルと手順を揃える
      - name: Format / Lint / Type-aware check
        run: vp run check

      - name: Typecheck (Astro)
        run: vp run typecheck

      - name: Unit tests
        run: vp test run

      - name: E2E tests
        run: vp run test:e2e

      - name: Build
        run: vp run build

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      deployments: write
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # sfw（版固定 + sha256 検証）と Vite+ のセットアップ、frozen install（両ジョブ共通）
      - name: Setup web toolchain
        uses: ./.github/actions/setup-web

      - name: Verify metadata reproducibility
        run: |
          vp run gen:meta
          git diff --exit-code

      - name: Build
        run: vp run build

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # devDependencies と同じ版にして、Action 側での追加インストールを避ける
          wranglerVersion: "4.152.0"
          workingDirectory: apps/web
          packageManager: pnpm
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main

      - name: Show deployment URL
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Deployment Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
